# ============================================================================
# DOCKER COMPOSE: ПРОГРАМНО-АНАЛІТИЧНИЙ КОМПЛЕКС "ПАКАПА" (Варіант 3)
# Тема: Аналіз пунктуальності авіарейсів і чинників затримок
# Архітектура: Lambda (Batch US DOT BTS + Speed OpenSky Kafka) + Medallion
# ============================================================================
name: flights-analytics

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - ./src:/app/src
    - ./dashboard:/app/dashboard
    - ./config:/app/config
    - ./sql:/app/sql
    - ./tests:/app/tests
    - ./data:/app/data
    - ./models:/app/models
    - ./backups:/app/backups
  environment:
    PYTHONPATH: /app
    PG_HOST: postgres
    PG_PORT: 5432
    PG_DB: ${PG_DB:-flights_dw}
    PG_USER: ${PG_USER:-flights_user}
    PG_PASSWORD: ${PG_PASSWORD:-flights_pass}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_TOPIC_LIVE: ${KAFKA_TOPIC_LIVE:-flights.live.stream}
    KAFKA_TOPIC_DLQ: ${KAFKA_TOPIC_DLQ:-flights.dlq}
    OPENSKY_MODE: ${OPENSKY_MODE:-auto}
    BTS_NUM_RECORDS: ${BTS_NUM_RECORDS:-100000}

services:
  # 1. Реляційна аналітична СУБД вітрин даних (Gold Layer + Stream + ML + DQ)
  postgres:
    image: postgis/postgis:16-3.4
    container_name: flights-postgres
    hostname: postgres
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_DB: ${PG_DB:-flights_dw}
      POSTGRES_USER: ${PG_USER:-flights_user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-flights_pass}
    ports:
      - "5432:5432"
    volumes:
      - flights-pg-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-flights_user} -d ${PG_DB:-flights_dw}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # 2. Брокер потокових повідомлень Apache Kafka (KRaft Mode без Zookeeper)
  kafka:
    image: apache/kafka:3.8.0
    container_name: flights-kafka
    hostname: kafka
    mem_limit: 768m
    cpus: 1.0
    ports:
      - "9094:9094"
    environment:
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms256m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 8s
      timeout: 5s
      retries: 12

  # 3. Ініціалізація топіків Kafka
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: flights-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic flights.live.stream --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic flights.dlq --partitions 1 --replication-factor 1

  # 4. BI-Дашборд (Streamlit + Plotly)
  bi-dashboard:
    <<: *app-common
    container_name: flights-bi-dashboard
    mem_limit: 768m
    cpus: 1.0
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]

  # 5. Пакетний конвеєр PySpark (ETL Bronze->Silver->Gold + Data Quality + Spark MLlib)
  spark-pipeline:
    <<: *app-common
    container_name: flights-spark-pipeline
    profiles: ["jobs"]
    mem_limit: 1536m
    cpus: 1.5
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "src.main_pipeline", "--records", "100000"]

  # 6. Потоковий продюсер (OpenSky Network API -> Kafka)
  opensky-producer:
    <<: *app-common
    container_name: flights-opensky-producer
    profiles: ["streaming"]
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: ["python", "-m", "src.streaming.opensky_producer", "--mode", "auto", "--batches", "5"]

  # 7. Потоковий консьюмер/обробник (Kafka -> DQ & ML Inference -> PostgreSQL)
  stream-processor:
    <<: *app-common
    container_name: flights-stream-processor
    profiles: ["streaming"]
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: ["python", "-m", "src.streaming.stream_processor", "--max-messages", "150"]

volumes:
  flights-pg-data:
